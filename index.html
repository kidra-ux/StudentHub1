    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Raccogli i dati inseriti dallo studente
            const studente = {
                nome: document.getElementById('studentName').value || 'Studente',
                eta: document.getElementById('studentAge').value,
                classe: document.getElementById('studentClass').value,
                votoObiettivo: document.getElementById('targetGrade').value
            };

            // Salva i dati localmente nel browser
            localStorage.setItem('studyMate_user', JSON.stringify(studente));

            // Trova il percorso corretto per la dashboard indipendentemente dal dispositivo
            const currentPath = window.location.pathname;
            const basePath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
            
            // Reindirizza alla dashboard
            window.location.href = basePath + 'dashboard.html';
        });
    </script>
