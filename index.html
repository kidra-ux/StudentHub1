<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub1 - Spazio Studio</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-white: #ffffff;
            --bg-gray: #f8f9fa;
            --text-dark: #2d3748;
            --primary-green: #57886c;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-gray); color: var(--text-dark); min-height: 100vh; padding: 10px; }
        
        /* SCHERMATA LOGIN */
        .login-box { background: var(--bg-white); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); max-width: 400px; margin: 40px auto; }
        .login-box h1 { color: var(--primary-green); text-align: center; margin-bottom: 20px; font-size: 1.6rem; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; font-weight: 600; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; }
        
        /* BOTTONI */
        .btn { width: 100%; padding: 12px; background: var(--primary-green); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-action { padding: 8px 12px; font-size: 0.85rem; background: var(--bg-gray); color: var(--text-dark); border: 1px solid var(--border-color); border-radius: 6px; }

        /* DASHBOARD (NASCOSTA ALL'INIZIO) */
        #main-dashboard { display: none; background: var(--bg-white); border-radius: 12px; border: 1px solid var(--border-color); min-height: 80vh; flex-direction: column; overflow: hidden; }
        .user-bar { background: #eef4f0; padding: 10px; font-size: 0.8rem; color: var(--primary-green); font-weight: 600; display: flex; justify-content: space-between; }
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; text-align: center; padding: 12px 0; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #718096; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary-green); border-bottom-color: var(--primary-green); background: #eef4f0; }
        .content-area { padding: 15px; flex: 1; }
        .panel { display: none; }
        .panel.active { display: block; }

        /* CHAT BOX */
        .chat-box { border: 1px solid var(--border-color); border-radius: 8px; height: 300px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-gray); margin-top: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; max-width: 85%; }
        .msg.ai { background: white; align-self: flex-start; border: 1px solid var(--border-color); }
        .msg.user { background: var(--primary-green); color: white; align-self: flex-end; }
        .chat-input-area { display: flex; gap: 5px; margin-top: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; }
        .chat-input-area button { width: auto; padding: 0 15px; }

        /* GRIDS */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .card { background: var(--bg-gray); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; text-align: center; font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>

    <!-- PAGINA DI ACCESSO -->
    <div id="login-page">
        <div class="login-box">
            <h1>StudentHub1</h1>
            <!-- Nota: rimosso il tag <form> per evitare qualsiasi refresh automatico sui telefoni -->
            <div class="input-group">
                <label>Nome (Facoltativo)</label>
                <input type="text" id="u-name" placeholder="Es. Mario">
            </div>
            <div class="input-group">
                <label>Età</label>
                <input type="number" id="u-age" placeholder="Es. 16">
            </div>
            <div class="input-group">
                <label>Classe</label>
                <input type="text" id="u-class" placeholder="Es. 3A Liceo">
            </div>
            <div class="input-group">
                <label>Voto Obiettivo</label>
                <input type="text" id="u-target" placeholder="Es. 8/10">
            </div>
            <button class="btn" onclick="effettuaAccesso()">Inizia a Studiare</button>
        </div>
    </div>

    <!-- SITO REALE / DASHBOARD -->
    <div id="main-dashboard">
        <div class="user-bar">
            <span id="label-name">Studente</span>
            <span id="label-details">Classe | Target</span>
        </div>

        <div class="tabs">
            <div class="tab-btn active" id="t1" onclick="cambiaScheda('sezione-ia', 't1')">🤖 Chat IA</div>
            <div class="tab-btn" id="t2" onclick="cambiaScheda('sezione-com', 't2')">👥 Community</div>
            <div class="tab-btn" id="t3" onclick="cambiaScheda('sezione-mat', 't3')">🗂️ Materie</div>
        </div>

        <div class="content-area">
            <!-- SCHEDA 1: IA -->
            <div id="sezione-ia" class="panel active">
                <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                    <button class="btn-action" onclick="alert('IA: Flashcard pronte!')">📝 Flashcard</button>
                    <button class="btn-action" onclick="alert('IA: Riassunto generato!')">⏱️ Riassunto</button>
                    <button class="btn-action" onclick="avviaQuiz()">❓ Quiz</button>
                    <button class="btn-action" style="background:#4a5568; color:white;" onclick="salvaChatInCasella()">📦 Salva Chat</button>
                </div>
                <div class="chat-box" id="box-messaggi">
                    <div class="msg ai">Ciao! Chiedimi un riassunto, spiegazioni o premi "Quiz" per metterti alla prova!</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="input-messaggio" placeholder="Scrivi qui...">
                    <button class="btn" onclick="inviaMessaggioChat()">Invia</button>
                </div>
            </div>

            <!-- SCHEDA 2: COMMUNITY -->
            <div id="sezione-com" class="panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="font-size:0.95rem;">Appunti condivisi</h3>
                    <button class="btn-action">+ Carica</button>
                </div>
                <div class="grid">
                    <div class="card">📝 Divina Commedia<br><span style="font-size:0.7rem; color:#718096;">Da Elena</span></div>
                    <div class="card">📐 Formule Fisica<br><span style="font-size:0.7rem; color:#718096;">Da Marco</span></div>
                </div>
            </div>

            <!-- SCHEDA 3: MATERIE -->
            <div id="sezione-mat" class="panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="font-size:0.95rem;">Le tue Caselle</h3>
                    <button class="btn-action" onclick="aggiungiMateria()">+ Nuova</button>
                </div>
                <div class="grid" id="container-materie">
                    <div class="card" style="background:#eef4f0; color:var(--primary-green);">📚 Generale</div>
                    <div class="card">📐 Matematica</div>
                    <div class="card">🌍 Storia</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Funzione di accesso senza form tag (IMPOSSIBILE CHE DA ERRORE 404 O REFRESH)
        function effettuaAccesso() {
            const nome = document.getElementById('u-name').value || 'Studente';
            const eta = document.getElementById('u-age').value || '-';
            const classe = document.getElementById('u-class').value || '-';
            const target = document.getElementById('u-target').value || '-';

            // Inserisce i dati nei testi della dashboard
            document.getElementById('label-name').innerText = "👋 Ciao, " + nome;
            document.getElementById('label-details').innerText = classe + " | Obiettivo: " + target;

            // Nasconde il login e mostra il sito reale usando i blocchi CSS puri
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'flex';
        }

        function cambiaScheda(pannelloId, bottoneId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(pannelloId).classList.add('active');
            document.getElementById(bottoneId).classList.add('active');
        }

        function inviaMessaggioChat() {
            const input = document.getElementById('input-messaggio');
            if(input.value.trim() === "") return;

            const box = document.getElementById('box-messaggi');
            const uMsg = document.createElement('div');
            uMsg.className = 'msg user';
            uMsg.innerText = input.value;
            box.appendChild(uMsg);

            input.value = "";
            box.scrollTop = box.scrollHeight;

            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'msg ai';
                aiMsg.innerText = "Ottima domanda! Quando collegheremo Google Gemini potrò generare risposte complete per te.";
