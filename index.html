<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub1 - Studio</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-white: #ffffff;
            --bg-gray: #f8f9fa;
            --text-dark: #2d3748;
            --primary-green: #57886c;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-gray); color: var(--text-dark); min-height: 100vh; padding: 15px; }
        
        /* SCHERMATA LOGIN */
        #login-page { display: block; background: var(--bg-white); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); max-width: 400px; margin: 30px auto; }
        #login-page h1 { color: var(--primary-green); text-align: center; margin-bottom: 20px; font-size: 1.6rem; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; font-weight: 600; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; background: var(--bg-gray); outline: none; }
        
        /* BOTTONI */
        .btn { width: 100%; padding: 12px; background: var(--primary-green); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-action { padding: 8px 12px; font-size: 0.85rem; background: var(--bg-white); color: var(--text-dark); border: 1px solid var(--border-color); border-radius: 6px; }

        /* DASHBOARD REALE (COMPLETAMENTE NASCOSTA ALL'INIZIO) */
        #main-dashboard { display: none; background: var(--bg-white); border-radius: 12px; border: 1px solid var(--border-color); padding: 15px; }
        .user-bar { background: #eef4f0; padding: 10px; font-size: 0.8rem; color: var(--primary-green); font-weight: 600; display: flex; justify-content: space-between; border-radius: 6px; margin-bottom: 15px; }
        
        /* NAVIGAZIONE SCHEDE */
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        .tab-btn { flex: 1; text-align: center; padding: 12px 0; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #718096; }
        .tab-btn.active { color: var(--primary-green); border-bottom: 3px solid var(--primary-green); background: #eef4f0; border-radius: 6px 6px 0 0; }
        
        .panel { display: none; }
        .panel.active { display: block; }

        /* CHAT BOX */
        .chat-box { border: 1px solid var(--border-color); border-radius: 8px; height: 260px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-gray); margin-top: 15px; }
        .msg { padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; max-width: 85%; line-height: 1.4; }
        .msg.ai { background: white; align-self: flex-start; border: 1px solid var(--border-color); }
        .msg.user { background: var(--primary-green); color: white; align-self: flex-end; }
        .chat-input-area { display: flex; gap: 5px; margin-top: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; }
        
        /* GRIDS */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .card { background: var(--bg-gray); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; text-align: center; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>

    <!-- SCHERMATA LOGIN -->
    <div id="login-page">
        <h1>StudentHub1</h1>
        <div class="input-group">
            <label>Nome (Facoltativo)</label>
            <input type="text" id="u-name" placeholder="Es. Mario">
        </div>
        <div class="input-group">
            <label>Età</label>
            <input type="number" id="u-age" placeholder="Es. 16">
        </div>
        <div class="input-group">
            <label>Classe</label>
            <input type="text" id="u-class" placeholder="Es. 3A Liceo">
        </div>
        <div class="input-group">
            <label>Voto Obiettivo</label>
            <input type="text" id="u-target" placeholder="Es. 8/10">
        </div>
        <button class="btn" onclick="effettuaAccesso()">Inizia a Studiare</button>
    </div>

    <!-- SITO REALE / DASHBOARD -->
    <div id="main-dashboard">
        <div class="user-bar">
            <span id="label-name">👋 Ciao</span>
            <span id="label-details">Classe | Target</span>
        </div>

        <div class="tabs">
            <div class="tab-btn active" id="t1" onclick="cambiaScheda('sezione-ia', 't1')">🤖 Chat IA</div>
            <div class="tab-btn" id="t2" onclick="cambiaScheda('sezione-com', 't2')">👥 Community</div>
            <div class="tab-btn" id="t3" onclick="cambiaScheda('sezione-mat', 't3')">🗂️ Materie</div>
        </div>

        <!-- SCHEDA 1: ASSISTENTE IA -->
        <div id="sezione-ia" class="panel active">
            <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                <button class="btn-action" onclick="alert('IA: Creazione flashcard avviata!')">📝 Flashcard</button>
                <button class="btn-action" onclick="alert('IA: Elaborazione riassunto dell\'argomento...')">⏱️ Riassunto</button>
                <button class="btn-action" onclick="avviaQuiz()">❓ Quiz</button>
                <button class="btn-action" style="background:#4a5568; color:white;" onclick="salvaChatInCasella()">📦 Salva Chat</button>
            </div>
            <div class="chat-box" id="box-messaggi">
                <div class="msg ai">Ciao! Chiedimi un riassunto, piani personalizzati o premi "Quiz" per metterti alla prova!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="input-messaggio" placeholder="Scrivi qui...">
                <button class="btn" style="width:auto; padding:0 15px;" onclick="inviaMessaggioChat()">Invia</button>
            </div>
        </div>

        <!-- SCHEDA 2: COMMUNITY -->
        <div id="sezione-com" class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-size:0.95rem;">Materiali Condivisi</h3>
                <button class="btn-action">+ Carica</button>
            </div>
            <div class="grid">
                <div class="card">📝 Divina Commedia<br><span style="font-size:0.7rem; color:#718096; font-weight:400;">Da Elena</span></div>
                <div class="card">📐 Formule Fisica<br><span style="font-size:0.7rem; color:#718096; font-weight:400;">Da Marco</span></div>
            </div>
        </div>

        <!-- SCHEDA 3: MATERIE -->
        <div id="sezione-mat" class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-size:0.95rem;">Le tue Caselle</h3>
                <button class="btn-action" onclick="aggiungiMateria()">+ Nuova</button>
            </div>
            <div class="grid" id="container-materie">
                <div class="card" style="background:#eef4f0; color:var(--primary-green);">📚 Generale</div>
                <div class="card">📐 Matematica</div>
                <div class="card">🌍 Storia</div>
            </div>
        </div>
    </div>

    <script>
        function effettuaAccesso() {
            var nome = document.getElementById('u-name').value || 'Studente';
            var classe = document.getElementById('u-class').value || '-';
            var target = document.getElementById('u-target').value || '-';

            document.getElementById('label-name').innerText = "👋 Ciao, " + nome;
            document.getElementById('label-details').innerText = classe + " | Obiettivo: " + target;

            // Scambio visivo elementare
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
        }

        function cambiaScheda(pannelloId, bottoneId) {
            var ePanels = document.getElementsByClassName('panel');
            for (var i = 0; i < ePanels.length; i++) { ePanels[i].style.display = 'none'; }
            
            var eTabs = document.getElementsByClassName('tab-btn');
            for (var j = 0; j < eTabs.length; j++) { eTabs[j].classList.remove('active'); }
            
            document.getElementById(pannelloId).style.display = 'block';
            document.getElementById(bottoneId).classList.add('active');
        }

        function inviaMessaggioChat() {
            var input = document.getElementById('input-messaggio');
            if(input.value.trim() === "") return;

            var box = document.getElementById('box-messaggi');
            var uMsg = document.createElement('div');
            uMsg.className = 'msg user';
            uMsg.innerText = input.value;
            box.appendChild(uMsg);

            input.value = "";
            box.scrollTop = box.scrollHeight;

            setTimeout(function() {
                var aiMsg = document.createElement('div');
                aiMsg.className = 'msg ai';
                aiMsg.innerText = "Ottima richiesta! Tra poco collegheremo le API di Google Gemini per darti risposte di studio reali.";
                box.appendChild(aiMsg);
                box.scrollTop = box.scrollHeight;
            }, 700);
        }

        function avviaQuiz() {
            var box = document.getElementById('box-messaggi');
            var aiMsg = document.createElement('div');
            aiMsg.className = 'msg ai';
