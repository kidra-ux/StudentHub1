<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - Accesso Studente</title>
    <!-- Font elegante e moderno -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #2d3748;
            --primary-green: #57886c; /* Il grigio-verde salvia */
            --primary-green-hover: #436a53;
            --light-gray: #f7fafc;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--light-gray);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: var(--bg-color);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border-color);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary-green);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.9rem;
            color: #718096;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4a5568;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: var(--light-gray);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-green);
            background-color: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-green-hover);
        }

        .optional-badge {
            font-size: 0.75rem;
            color: #a0aec0;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>Benvenuto su StudyMate</h1>
            <p>Configura il tuo spazio di studio personalizzato</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="studentName">Nome <span class="optional-badge">(Facoltativo)</span></label>
                <input type="text" id="studentName" placeholder="Es. Mario">
            </div>

            <div class="form-group">
                <label for="studentAge">Età</label>
                <input type="number" id="studentAge" required min="6" max="99" placeholder="Es. 16">
            </div>

            <div class="form-group">
                <label for="studentClass">Classe / Anno di corso</label>
                <input type="text" id="studentClass" required placeholder="Es. 3A Liceo Scientifico, Università...">
            </div>

            <div class="form-group">
                <label for="targetGrade">Voto che miri a raggiungere</label>
                <input type="text" id="targetGrade" required placeholder="Es. 8/10, 30L, 90/100...">
            </div>

            <button type="submit" class="btn-submit">Inizia a Studiare</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Raccogli i dati inseriti dallo studente
            const studente = {
                nome: document.getElementById('studentName').value || 'Studente',
                eta: document.getElementById('studentAge').value,
                classe: document.getElementById('studentClass').value,
                votoObiettivo: document.getElementById('targetGrade').value
            };

            // Salva i dati localmente nel browser per usarli nelle altre pagine
            localStorage.setItem('studyMate_user', JSON.stringify(studente));

            // Reindirizza alla dashboard principale (che creeremo nel prossimo passo)
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
